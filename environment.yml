# ============================================================
# Conda Environment — Multi-Drone Inspector
# ============================================================
# Creates the conda environment with all required dependencies.
#
# Usage:
#   conda env create -f environment.yml          # New install
#   conda env update -f environment.yml --prune   # Update existing
#   conda activate base                           # Use base env
#
# Or install into base directly:
#   conda install --file environment.yml
# ============================================================

name: base
channels:
  - defaults
  - conda-forge

dependencies:
  - python>=3.10
  - pip>=23.0
  - numpy>=1.24.0
  - pyyaml>=6.0
  - cmake>=3.16

  # Install remaining packages via pip (conda doesn't have all)
  - pip:
      # Flight control
      - mavsdk>=2.0.0
      - aioconsole>=0.7.0

      # Perception
      - ultralytics>=8.2.0
      - opencv-python-headless>=4.8.0
      - lap>=0.4.0

      # Dashboard backend
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.29.0
      - websockets>=12.0
      - python-multipart>=0.0.9
      - pydantic>=2.6.0

      # Reports
      - reportlab>=4.1.0

      # Config & utilities
      - transitions>=0.9.0
      - aiohttp>=3.9.0

      # Dev & testing tools
      - pytest>=8.0.0
      - pytest-asyncio>=0.23.0
      - pytest-timeout>=2.2.0
      - pytest-cov>=5.0.0
      - pytest-xdist>=3.5.0
      - ruff>=0.3.0
      - mypy>=1.9.0
